[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "ollama>=0.4.7,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
runbook-ai-eval = "runbook_ai.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
